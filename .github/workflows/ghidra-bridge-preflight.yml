name: Compile packaged Ghidra bridge

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Acquire the verified Ghidra API jars in runner temporary storage
        shell: bash
        run: |
          bridge_tool_root="${RUNNER_TEMP}/rea-ghidra-bridge-12.1.4"
          mkdir -p "${bridge_tool_root}"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip \
            --output "${bridge_tool_root}/ghidra.zip"
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra.zip' \
            | (cd "${bridge_tool_root}" && sha256sum --check --strict)
          unzip -q "${bridge_tool_root}/ghidra.zip" -d "${bridge_tool_root}"
          echo "GHIDRA_INSTALL_DIR=${bridge_tool_root}/ghidra_12.1.4_PUBLIC" >> "${GITHUB_ENV}"
      - name: Compile all packaged sources with the runner's existing JDK 21
        shell: bash
        run: JAVA_HOME="${JAVA_HOME_21_X64:?Runner JDK 21 is required}" node scripts/verify-ghidra-bridge.mjs
